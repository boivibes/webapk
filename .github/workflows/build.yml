name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          set -e
          ANDROID_JAR=$(ls $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p obj out
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d obj $(find src -name "*.java")
          $BT/d8 --lib "$ANDROID_JAR" --min-api 24 --output out $(find obj -name "*.class")
          $BT/aapt package -f -M AndroidManifest.xml -I "$ANDROID_JAR" -F out/base.apk
          cd out && $BT/aapt add base.apk classes.dex && cd ..
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          $BT/apksigner sign --ks debug.keystore --ks-key-alias debug \
            --ks-pass pass:android --key-pass pass:android \
            --out out/app-debug.apk out/base.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk
